name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please never paste your Flickr API key, secret or setup code. Remove them from logs before posting.
  - type: input
    id: version
    attributes:
      label: Albumsmith version
      description: Shown in the footer of every page.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For example the rule you used and what you pressed.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of "docker compose logs albumsmith", with secrets removed.
      render: text
  - type: input
    id: env
    attributes:
      label: Browser and setup
      description: Browser, and whether you run behind a reverse proxy.
