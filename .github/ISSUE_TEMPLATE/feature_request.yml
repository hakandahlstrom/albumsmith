name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the album you want to build.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Albumsmith to do?
    validations:
      required: true
